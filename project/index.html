<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Tester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

  <header class="page-header">
    <h1>API Tester</h1>
    <p class="subtitle">Send a request and hope it works! haha :)</p>
  </header>

  <!--REQUEST BAR (hero element)-->
  <div class="request-bar">
    <select id="methodSelect" class="method-select">
      <option value="GET">GET</option>
      <option value="POST">POST</option>
      <option value="PUT">PUT</option>
      <option value="PATCH">PATCH</option>
      <option value="DELETE">DELETE</option>
    </select>
    <input type="text" id="urlInput" class="url-input" value="https://jsonplaceholder.typicode.com/posts/1">
    <button id="sendBtn" class="send-btn">Send</button>
  </div>

  <!--REQUEST DETAILS-->
  <section class="panel">

    <div class="field-header">
      <h2>Query parameters</h2>
      <button type="button" class="link-btn" id="addParamBtn">+ Add parameter</button>
    </div>
    <div id="paramsList" class="kv-list"></div>

    <div class="field-header">
      <h2>Headers</h2>
      <button type="button" class="link-btn" id="addHeaderBtn">+ Add header</button>
    </div>
    <div id="headersList" class="kv-list"></div>

    <div class="field-header">
      <h2>Request body</h2>
      <span class="hint">JSON &middot; sent with POST, PUT, PATCH</span>
    </div>
    <textarea id="bodyInput" class="body-input" rows="6" placeholder='{ "title": "hello" }'></textarea>

    <div class="button-row">
      <button type="button" id="clearBtn" class="secondary-btn">Clear</button>
    </div>
  </section>

  <div id="errorBox" class="error-box"></div>

  <!--RESPONSE-->
  <section id="results" class="panel" style="display:none;">
    <div class="response-summary">
      <div class="summary-item">
        <span class="summary-label">Status</span>
        <span id="status" class="summary-value"></span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <span class="summary-label">Time</span>
        <span id="time" class="summary-value"></span>
      </div>
    </div>

    <div class="field-header">
      <h2>Response headers</h2>
    </div>
    <pre id="responseHeaders" class="output-block"></pre>

    <div class="field-header">
      <h2>Response body</h2>
      <button type="button" class="link-btn" id="copyBtn">Copy</button>
    </div>
    <pre id="body" class="output-block"></pre>
  </section>

  <!--HISTORY-->
  <section class="panel">
    <div class="field-header">
      <h2>History</h2>
      <button type="button" class="link-btn" id="clearHistoryBtn">Clear</button>
    </div>
    <div id="historyList"></div>
  </section>

</div>

<script src="js/script.js"></script>
</body>
</html>
